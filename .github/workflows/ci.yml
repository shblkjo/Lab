name: .NET CI Pipeline (NUnit)

on:
  push:
    branches: [ "main", "ai-1", "ai-2", "ai-3" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Добавлено для ручного запуска

jobs:
  test-generation-and-execution:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Получение кода
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2. Настройка Python для генератора
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pyyaml
      
      # 3. Генерация тестов из спецификации
      - name: Generate NUnit tests
        run: python generator/gen_tests.py --config config.yaml
      
      # 4. Настройка .NET SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      
      # 5. Восстановление зависимостей и сборка
      - name: Restore dependencies
        run: dotnet restore
      
      - name: Build
        run: dotnet build --no-restore --configuration Release
      
      # 6. Запуск тестов (существующие + сгенерированные)
      - name: Run tests
        run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
      
      # 7. Сохранение результатов
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nunit-test-results
          path: |
            **/TestResults/
            **/*.trx
